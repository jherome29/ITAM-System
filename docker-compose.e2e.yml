# Throwaway Postgres for the backend e2e suite — mirrors the CI `backend-e2e`
# service container. Data lives in tmpfs, so the DB is fully ephemeral and fast;
# `npm run test:e2e:local` (Backend/) brings it up, runs the suite, tears it down.
#
# NODE_ENV=test makes AppModule build the schema from the entities
# (`synchronize: true`) with SSL off — no migrations needed here.
services:
  e2e-postgres:
    image: postgres:16
    container_name: aimrs_e2e_postgres
    environment:
      POSTGRES_USER: aimrs_test
      POSTGRES_PASSWORD: aimrs_test
      POSTGRES_DB: aimrs_test
    ports:
      - '5433:5432' # 5433 on the host to avoid clashing with the dev DB on 5432
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aimrs_test -d aimrs_test']
      interval: 3s
      timeout: 3s
      retries: 20
