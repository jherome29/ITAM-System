name: Security

on:
  push:
    branches: [develop, test, uat, main]
  pull_request:
    branches: [develop, test, uat, main]
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Security tab
  actions: read

jobs:
  # ── Secret Scan ───────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run secretlint
        run: npx secretlint "**/*"

  # ── CodeQL ────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # ── Dependency Audit ──────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm audit --workspace is unreliable across npm versions.
      # Run from each directory directly for consistent behavior.
      - name: Backend audit (JSON report)
        run: cd Backend && npm audit --audit-level=high --json > /tmp/backend-audit.json || true

      - name: Frontend audit (JSON report)
        run: cd Frontend && npm audit --audit-level=high --json > /tmp/frontend-audit.json || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: |
            /tmp/backend-audit.json
            /tmp/frontend-audit.json
          retention-days: 30

      # These steps actually fail the job if high/critical CVEs exist
      - name: Fail on Backend high/critical CVEs
        run: cd Backend && npm audit --audit-level=high

      - name: Fail on Frontend high/critical CVEs
        run: cd Frontend && npm audit --audit-level=high

  # ── OWASP Dependency-Check ────────────────────────────────────────────────
  # continue-on-error: true prevents a slow NVD DB fetch or empty NVD_API_KEY
  # from blocking the security workflow. Remove once the pipeline is stable.
  owasp-dc:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # OWASP DC runs in a Docker container that mounts the workspace.
      # node_modules must be present for the Node Audit Analyzer to work.
      - name: Install dependencies
        run: npm ci

      # Build args string — only include --nvdApiKey when the secret is set.
      # Passing --nvdApiKey with an empty value causes a CLI parse error.
      - name: Build OWASP DC args
        id: owasp_args
        run: |
          ARGS="--enableRetired"
          if [ -n "${{ secrets.NVD_API_KEY }}" ]; then
            ARGS="$ARGS --nvdApiKey ${{ secrets.NVD_API_KEY }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      # First run downloads the NVD database (~10 min). Subsequent runs use cache.
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'AIMRS'
          path: '.'
          format: 'ALL'
          args: ${{ steps.owasp_args.outputs.args }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dc-report
          path: reports/dependency-check-report.html
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif

  # --- FUTURE: CD JOBS ---
  # Add after Docker image build is configured:
  #
  # trivy-scan:
  #   Scan built Docker images using aquasecurity/trivy-action
  #   Upload SARIF to GitHub Security tab
  #
  # docker-push:
  #   Build and push images to GitHub Container Registry (ghcr.io)
  #   Trigger: push to main only
  #   Requires: GHCR_TOKEN secret
