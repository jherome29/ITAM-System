name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, test, uat, main]

permissions:
  contents: read

jobs:
  # ── Shared Package ────────────────────────────────────────────────────────
  shared-pkg:
    name: Shared Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (shared)
        run: cd packages/shared && npx tsc --noEmit

  # ── Backend CI ────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    needs: shared-pkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: cd Backend && npx tsc --noEmit

      - name: ESLint
        run: cd Backend && npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 0

      - name: Build
        run: cd Backend && npm run build

      - name: Unit tests
        run: cd Backend && npm run test

      - name: Coverage (threshold enforced)
        run: cd Backend && npm run test:cov

      # Upload even when the threshold step fails so SonarCloud always
      # has coverage data to download in the same workflow run.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: coverage/lcov.info
          retention-days: 1

  # ── SonarCloud ────────────────────────────────────────────────────────────
  # Runs after backend-ci to consume the coverage artifact from this same run.
  # All real steps are gated on SONAR_TOKEN being present so the job shows
  # green (skipped) rather than red (failed) until the token is configured.
  # Setup: sonarcloud.io → My Account → Security → Generate Token →
  #        GitHub repo Settings → Secrets → SONAR_TOKEN
  # Also update sonar-project.properties with your real org slug.
  sonarcloud:
    name: SonarCloud
    needs: backend-ci
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip if SONAR_TOKEN not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN not set — skipping SonarCloud scan. Add the secret and update sonar-project.properties to enable."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0  # SonarCloud needs full history for blame info

      # continue-on-error so SonarCloud scan still runs even when
      # backend-ci failed before uploading the coverage artifact.
      - name: Download coverage report
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: coverage

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2500896589ef8f7247069a56136f8dc177c27ccf # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Frontend CI ───────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    needs: shared-pkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsconfig.json already has "noEmit": true — pass -p explicitly so tsc
      # doesn't fall back to help output on some TypeScript versions.
      - name: TypeScript check
        run: cd Frontend && npx tsc -p tsconfig.json

      - name: ESLint
        run: cd Frontend && npx eslint . --max-warnings 0

      - name: Build
        run: cd Frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

  # ── Backend E2E ───────────────────────────────────────────────────────────
  backend-e2e:
    name: Backend E2E
    needs: shared-pkg
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aimrs_test
          POSTGRES_PASSWORD: aimrs_test
          POSTGRES_DB: aimrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The e2e test boots AppModule which connects to TypeORM.
      # DATABASE_URL is constructed at runtime from parts to avoid
      # secretlint flagging a literal connection string in this file.
      - name: Run e2e tests
        run: |
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@localhost:${DB_PORT}/${DB_NAME}?sslmode=disable"
          cd Backend && npm run test:e2e
        env:
          DB_USER: aimrs_test
          DB_PASS: aimrs_test
          DB_PORT: 5432
          DB_NAME: aimrs_test
          JWT_SECRET: ci-test-jwt-secret-32-chars-minimum
          JWT_EXPIRES_IN: 8h
          NODE_ENV: test
